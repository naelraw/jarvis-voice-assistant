<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS</title>
<link rel="icon" href="/favicon.png">
<style>
  :root {
    --bg: #02060c;
    --accent: 0, 210, 255;
    --text: #d6ecf5;
    --muted: #7d98a8;
    --card: rgba(8, 22, 34, 0.78);
    --line: rgba(0, 210, 255, 0.22);
  }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden;
    font-family: "Segoe UI", system-ui, sans-serif; color: var(--text); }
  body::before { /* léger quadrillage façon HUD */
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .5;
    background-image: linear-gradient(rgba(0,210,255,.035) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(0,210,255,.035) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
  }
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }  /* la sphère (pas le globe 3D) */

  /* ---------------- petites fenêtres flottantes autour de la sphère */
  #cards { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .card { position: absolute; pointer-events: auto; max-height: 62vh; display: flex; flex-direction: column;
    background: linear-gradient(180deg, rgba(4,18,30,.9), rgba(2,10,18,.86)); border: 1px solid rgba(0,210,255,.16);
    box-shadow: 0 0 40px rgba(0,120,200,.08) inset, 0 12px 40px rgba(0,0,0,.45); backdrop-filter: blur(10px);
    opacity: 0; clip-path: inset(0 0 100% 0); transition: opacity .25s, clip-path .3s ease; }
  .card.shown { opacity: 1; clip-path: inset(-20px -20px -20px -20px); }
  .card.closing { opacity: 0; clip-path: inset(0 0 100% 0); }
  .chead { display: flex; align-items: center; gap: 10px; padding: 9px 10px 8px 16px; cursor: grab;
    border-bottom: 1px solid rgba(0,210,255,.16); user-select: none; touch-action: none;
    background: linear-gradient(90deg, rgba(var(--accent), .12), transparent 70%); }
  .chead:active { cursor: grabbing; }
  .chead::before { content: ""; width: 6px; height: 6px; background: rgb(var(--accent)); box-shadow: 0 0 8px rgb(var(--accent)); }
  .ctitle { flex: 1; color: #fff; font: 600 13px "Bahnschrift", "Segoe UI", sans-serif; letter-spacing: 3px; text-transform: uppercase;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 0 10px rgba(0,210,255,.45); }
  .cx { width: 28px; height: 24px; border: 1px solid rgba(0,210,255,.2); background: transparent;
    color: rgba(var(--accent), .8); cursor: pointer; font-size: 12px; }
  .cx:hover { color: #ffb0b0; border-color: rgba(255,110,110,.8); box-shadow: 0 0 10px rgba(255,80,80,.35); }
  .cbody { padding: 12px 16px 16px; overflow-y: auto; font-size: 15px; line-height: 1.55; }
  .cbody::-webkit-scrollbar { width: 6px; }
  .cbody::-webkit-scrollbar-thumb { background: rgba(0,210,255,.3); }
  .mdc > :first-child { margin-top: 2px; }
  .mdc h1, .mdc h2, .mdc h3, .mdc h4 { color: #fff; margin: 1.1em 0 .45em; line-height: 1.3; }
  .mdc h2 { font-size: 17px; font-weight: 600; }
  .mdc h3, .mdc h4 { font-size: 12.5px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase;
    color: rgb(var(--accent)); padding-bottom: 5px; border-bottom: 1px solid var(--line); }
  .mdc p { margin: .5em 0; color: #cfe3ec; }
  .mdc ul, .mdc ol { padding-left: 1.2em; margin: .45em 0; }
  .mdc li { margin: .38em 0; padding-left: 2px; color: #cfe3ec; }
  .mdc li::marker { color: rgb(var(--accent)); }
  .mdc strong { color: #fff; font-weight: 600; }
  .mdc p.foot { color: var(--muted); font-size: 13px; margin-top: .9em; }
  .chart { width: 100%; height: auto; margin: 6px 0 4px; overflow: visible; }
  .chart rect { fill: rgba(var(--accent), .75); }
  .chart .cv { fill: #fff; font-size: 10px; text-anchor: middle; }
  .chart .cl { fill: var(--muted); font-size: 9.5px; text-anchor: middle; }
  /* panneau de tâche : accent orange comme la sphère */
  .card.task { --accent: 255, 160, 40; --line: rgba(255,160,40,.28);
    box-shadow: 0 12px 40px rgba(0,0,0,.45), 0 0 30px rgba(255,160,40,.12); }
  .card.task .chead::before { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .mdc a { color: rgb(var(--accent)); text-decoration: none; }
  .mdc a:hover { text-decoration: underline; }
  .mdc code { background: rgba(0,210,255,.1); padding: 2px 6px; border-radius: 6px;
    font-family: Consolas, monospace; font-size: .9em; }
  .mdc pre { background: rgba(0,0,0,.4); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 18px; overflow-x: auto; }
  .mdc pre code { background: none; padding: 0; }
  .mdc table { border-collapse: collapse; margin: .8em 0; width: 100%; }
  .mdc th, .mdc td { border: 1px solid var(--line); padding: 8px 12px; text-align: left; }
  .mdc th { background: rgba(0,210,255,.08); color: #fff; }
  .mdc hr { border: none; border-top: 1px solid var(--line); margin: 1.2em 0; }
  .mdc blockquote { margin: .6em 0; padding: .2em 1em; border-left: 3px solid rgb(var(--accent));
    color: var(--muted); }
  .cursor { display: inline-block; width: 9px; height: 1.1em; margin-left: 3px; vertical-align: -3px;
    background: rgb(var(--accent)); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }


  /* ================= HUD façon JARVIS (Iron Man) : cadres fins, équerres aux coins, majuscules espacées ======= */
  :root { --hud: "Bahnschrift", "Segoe UI", sans-serif; --mono: "Cascadia Mono", "Consolas", monospace;
    --glow: 0 0 10px rgba(0,210,255,.55); --frame: rgba(0,210,255,.16); }
  /* équerres lumineuses aux 4 coins d'un cadre (.hudbox) */
  .hudbox { position: relative; }
  .card.hudbox { position: absolute; }  /* les petites fenêtres restent libres (sinon elles s'empilent et sautent) */
  .hudbox::before, .hudbox::after { content: ""; position: absolute; width: 14px; height: 14px; pointer-events: none;
    border: 0 solid rgb(var(--accent)); filter: drop-shadow(0 0 4px rgba(var(--accent), .8)); }
  .hudbox::before { top: -1px; left: -1px; border-top-width: 2px; border-left-width: 2px; }
  .hudbox::after { bottom: -1px; right: -1px; border-bottom-width: 2px; border-right-width: 2px; }
  .hudbox > .cn1, .hudbox > .cn2 { position: absolute; width: 14px; height: 14px; pointer-events: none;
    border: 0 solid rgba(var(--accent), .55); }
  .hudbox > .cn1 { top: -1px; right: -1px; border-top-width: 1px; border-right-width: 1px; }
  .hudbox > .cn2 { bottom: -1px; left: -1px; border-bottom-width: 1px; border-left-width: 1px; }
  /* trait gradué (règle) */
  .ticks { height: 6px; background: repeating-linear-gradient(90deg, rgba(var(--accent), .45) 0 1px, transparent 1px 8px);
    mask-image: linear-gradient(90deg, #000, transparent); opacity: .7; }

  /* cadre de l'écran + lignes de balayage */
  #frame { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
  #frame i { position: absolute; width: 46px; height: 46px; border: 0 solid rgba(0,210,255,.45); }
  #frame i:nth-child(1) { top: 6px; left: 6px; border-top-width: 1px; border-left-width: 1px; }
  #frame i:nth-child(2) { top: 6px; right: 6px; border-top-width: 1px; border-right-width: 1px; }
  #frame i:nth-child(3) { bottom: 6px; left: 6px; border-bottom-width: 1px; border-left-width: 1px; }
  #frame i:nth-child(4) { bottom: 6px; right: 6px; border-bottom-width: 1px; border-right-width: 1px; }
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 9; opacity: .22;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.35) 0 1px, transparent 1px 3px); }

  /* bandeau d'état en bas (au centre de la zone de la sphère) */
  #hudbar { position: fixed; bottom: 14px; left: calc(var(--sidew) + 40px); right: 70px; z-index: 2; pointer-events: none;
    display: flex; align-items: center; justify-content: center; gap: 18px; font: 11px var(--mono); letter-spacing: 2px;
    color: rgba(var(--accent), .75); text-transform: uppercase; white-space: nowrap; overflow: hidden; transition: left .2s ease; }
  #hudbar b { color: #e8f6ff; font-weight: 400; }
  #hudbar .dot { display: inline-block; width: 6px; height: 6px; margin-right: 7px; background: #3df0a0; vertical-align: 1px;
    box-shadow: 0 0 6px #3df0a0; }
  #hudbar .dot.off { background: #ffb36b; box-shadow: 0 0 6px #ffb36b; }
  @media (max-width: 1500px) { #hudbar .opt { display: none; } #hudbar { gap: 12px; letter-spacing: 1.5px; } }
  #page .chart { max-height: 260px; max-width: 820px; display: block; }
  #page .chart .cv, #page .chart .cl { font-family: "Cascadia Mono", Consolas, monospace; }
  #hudbar .sep { width: 40px; height: 1px; background: linear-gradient(90deg, transparent, rgba(var(--accent), .6), transparent); }

  /* zone pour déplacer la petite fenêtre (fenêtre sans cadre) ; double-clic = plein écran / petite */
  #drag { position: fixed; top: 0; left: calc(var(--sidew) + 28px); right: 170px; height: 44px; z-index: 3; }

  /* ---------------- panneau de gauche : onglets (agenda, rappels, notes, PC Radar, mails), réductible */
  :root { --sidew: 244px; }
  body.collapsed { --sidew: 62px; }
  #side { position: fixed; left: 16px; top: 16px; bottom: 16px; width: var(--sidew); z-index: 5; display: flex;
    flex-direction: column; gap: 2px; padding: 12px 8px 10px; box-sizing: border-box;
    background: linear-gradient(180deg, rgba(4,18,30,.86), rgba(2,10,18,.78)); border: 1px solid var(--frame);
    backdrop-filter: blur(10px); box-shadow: 0 0 40px rgba(0,120,200,.08) inset, 0 10px 30px rgba(0,0,0,.4);
    transition: width .2s ease; }
  #side .scroll { display: flex; flex-direction: column; gap: 2px; overflow: hidden; flex: 1; min-height: 0; }
  .sic { flex: none; width: 28px; height: 28px; display: grid; place-items: center; color: rgb(var(--accent)); }
  .sic svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round;
    stroke-linejoin: round; filter: drop-shadow(0 0 3px rgba(0,210,255,.6)); }
  .sbrand { display: flex; align-items: center; gap: 10px; padding: 2px 6px 8px; white-space: nowrap; overflow: hidden; }
  .sbrand .lg { font: 600 15px var(--hud); letter-spacing: 4px; color: #fff; text-shadow: var(--glow); }
  .sbrand .lg small { display: block; font: 9.5px var(--mono); letter-spacing: 2.5px; color: rgba(var(--accent), .7);
    text-shadow: none; margin-top: 2px; }
  .stog { margin-left: auto; flex: none; width: 28px; height: 28px; display: grid; place-items: center; padding: 0;
    border: 1px solid var(--frame); background: rgba(0,210,255,.04); color: var(--muted); cursor: pointer; }
  .stog .sic { width: 26px; height: 26px; color: inherit; transition: transform .2s; }
  .stog:hover { color: #fff; border-color: rgba(0,210,255,.7); box-shadow: var(--glow); }
  body.collapsed .stog .sic { transform: scaleX(-1); }
  body.collapsed .sbrand { padding: 2px 0 8px; justify-content: center; }
  body.collapsed .sbrand .lg { display: none; }
  body.collapsed .stog { margin: 0; }
  .ssec { font: 10px var(--mono); letter-spacing: 3px; color: rgba(var(--accent), .6); padding: 8px 8px 4px;
    display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .ssec::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--frame), transparent); }
  body.collapsed .ssec { font-size: 0; padding: 6px 4px; }
  .tab { position: relative; display: flex; align-items: center; gap: 10px; padding: 7px 8px; cursor: pointer;
    color: #cfe3ec; white-space: nowrap; user-select: none; border-left: 2px solid transparent; transition: background .15s; }
  .tab .idx { position: absolute; right: 8px; top: 6px; font: 9.5px var(--mono); color: rgba(var(--accent), .4); letter-spacing: 1px; }
  .tab:hover { background: linear-gradient(90deg, rgba(0,210,255,.10), transparent 85%); }
  .tab.on { background: linear-gradient(90deg, rgba(0,210,255,.20), rgba(0,210,255,.02) 90%); border-left-color: rgb(var(--accent));
    color: #fff; box-shadow: inset 8px 0 14px -10px rgba(0,210,255,.9); }
  .tab .tx { min-width: 0; flex: 1; overflow: hidden; }
  .tab .tx b { display: block; font: 600 13px var(--hud); letter-spacing: 2.4px; text-transform: uppercase; }
  .tab .tx small { display: block; color: var(--muted); font: 12.5px var(--hud); letter-spacing: .3px; overflow: hidden;
    text-overflow: ellipsis; margin-top: 2px; }
  .badge { flex: none; min-width: 20px; height: 18px; padding: 0 5px; box-sizing: border-box; border: 1px solid rgb(var(--accent));
    color: #fff; background: rgba(0,210,255,.16); font: 600 10.5px var(--mono); display: grid; place-items: center;
    box-shadow: 0 0 8px rgba(0,210,255,.35); margin-top: 10px; }
  .badge.warn { border-color: #ffa040; background: rgba(255,150,40,.18); box-shadow: 0 0 8px rgba(255,150,40,.4); }
  body.collapsed .badge { position: absolute; left: 24px; top: -2px; min-width: 18px; height: 16px; font-size: 9.5px;
    margin: 0; background: #06202e; }
  body.collapsed .badge.warn { background: #2a1606; }
  body.collapsed .tab .idx { display: none; }
  .squiet { display: flex; gap: 10px; align-items: center; padding: 8px; color: #ffb36b; font: 11.5px var(--mono);
    letter-spacing: .5px; line-height: 1.4; border: 1px solid rgba(255,160,60,.25); background: rgba(255,140,40,.06); }
  .squiet .sic { color: #ffb36b; }
  .squiet .sic svg { filter: drop-shadow(0 0 3px rgba(255,160,60,.7)); }
  body.collapsed .squiet { padding: 6px 0; justify-content: center; border: none; background: none; }
  .supd { color: rgba(var(--accent), .55); font: 10px var(--mono); letter-spacing: 2px; padding: 8px 8px 0;
    white-space: nowrap; text-transform: uppercase; }
  body.collapsed .tab .tx, body.collapsed .squiet .lb, body.collapsed .supd { display: none; }
  body.hasside #clock { left: calc(50% + (var(--sidew) + 16px) / 2); transition: left .2s ease; }

  /* ---------------- page ouverte par un onglet */
  #page { position: fixed; top: 64px; bottom: 44px; left: calc(var(--sidew) + 32px); right: 16px; z-index: 4;
    display: none; flex-direction: column; background: linear-gradient(180deg, rgba(3,14,24,.94), rgba(2,8,15,.94));
    border: 1px solid var(--frame); backdrop-filter: blur(12px); box-shadow: 0 0 60px rgba(0,120,200,.10) inset,
    0 14px 40px rgba(0,0,0,.5); transition: left .2s ease; }
  #page.open { display: flex; animation: pin .22s ease; }
  @keyframes pin { from { opacity: 0; clip-path: inset(0 0 100% 0); } to { opacity: 1; clip-path: inset(0 0 0 0); } }
  .phead { display: flex; align-items: flex-end; gap: 14px; padding: 14px 14px 10px 22px; }
  .phead .code { font: 10.5px var(--mono); letter-spacing: 3px; color: rgba(var(--accent), .7); margin-bottom: 4px; }
  .phead h2 { margin: 0; font: 300 26px var(--hud); letter-spacing: 8px; color: #fff; text-transform: uppercase;
    text-shadow: var(--glow); line-height: 1; }
  .phead .sub { flex: 1; color: var(--muted); font: 12px var(--mono); padding-bottom: 2px; }
  .phead .cx { align-self: flex-start; }
  #page .ticks { margin: 0 22px; }
  .pbody { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 22px 22px; font-size: 15px; line-height: 1.5; }
  .pbody::-webkit-scrollbar, .nlist::-webkit-scrollbar, .nview::-webkit-scrollbar { width: 6px; }
  .pbody::-webkit-scrollbar-thumb, .nlist::-webkit-scrollbar-thumb, .nview::-webkit-scrollbar-thumb { background: rgba(0,210,255,.3); }
  .si { display: flex; gap: 16px; padding: 9px 10px; border-bottom: 1px dashed rgba(0,210,255,.12); }
  .si:last-child { border-bottom: none; }
  .si .w { flex: none; min-width: 64px; color: rgb(var(--accent)); font: 13px var(--mono); padding-top: 2px; text-shadow: 0 0 6px rgba(0,210,255,.4); }
  .si .x { flex: 1; min-width: 0; color: #dcecf3; overflow-wrap: anywhere; }
  .si .x small { display: block; color: var(--muted); font-size: 13px; margin-top: 1px; }
  .si.past { opacity: .4; }
  .sday { display: flex; align-items: center; gap: 10px; color: rgb(var(--accent)); font: 600 11.5px var(--hud);
    letter-spacing: 3px; text-transform: uppercase; margin: 18px 0 4px; }
  .sday::before { content: ""; width: 6px; height: 6px; background: rgb(var(--accent)); box-shadow: var(--glow); }
  .sday::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(0,210,255,.4), transparent); }
  .sday:first-child { margin-top: 4px; }
  .sempty { color: var(--muted); padding: 10px 0; font: 13px var(--mono); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 4px 0 20px; }
  .kpi { background: rgba(0,210,255,.035); border: 1px solid var(--frame); padding: 12px 14px 10px; }
  .kpi b { display: block; color: #fff; font: 300 34px var(--hud); letter-spacing: 1px; text-shadow: var(--glow); line-height: 1.1; }
  .kpi span { color: var(--muted); font: 11px var(--mono); letter-spacing: 1px; text-transform: uppercase; }
  .kpi.warn b { color: #ffb36b; text-shadow: 0 0 10px rgba(255,150,40,.55); }
  .ncols { display: flex; gap: 18px; height: 100%; min-height: 0; }
  .nlist { flex: 0 0 clamp(170px, 34%, 300px); overflow-y: auto; padding-right: 6px; }
  .nlist .si { cursor: pointer; padding: 9px 10px; flex-direction: column; gap: 2px; border-left: 2px solid transparent; }
  .nlist .si .w { min-width: 0; font-size: 11.5px; }
  .nlist .si:hover { background: linear-gradient(90deg, rgba(0,210,255,.08), transparent); }
  .nlist .si.on { background: linear-gradient(90deg, rgba(0,210,255,.16), transparent); border-left-color: rgb(var(--accent)); }
  .nview { flex: 1; min-width: 0; overflow-y: auto; border-left: 1px solid var(--frame); padding-left: 20px; }
  #page .pbody.split { overflow: hidden; }

  /* ---------------- boutons du bas : clavier, micro, éteindre */
  #controls { position: fixed; bottom: 40px; left: calc(var(--sidew) + 40px); right: 70px; z-index: 6;
    display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; transition: left .2s ease; }
  #controls .row2 { display: flex; gap: 10px; pointer-events: auto; }
  .cbtn { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; cursor: pointer;
    border: 1px solid rgba(0,210,255,.25); background: rgba(3,14,24,.82); color: rgba(var(--accent), .9);
    font: 600 10.5px "Cascadia Mono", Consolas, monospace; letter-spacing: 2px; text-transform: uppercase;
    backdrop-filter: blur(8px); transition: all .15s; }
  .cbtn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .cbtn:hover { color: #fff; border-color: rgba(0,210,255,.8); box-shadow: 0 0 12px rgba(0,210,255,.45); }
  .cbtn.on { color: #fff; border-color: rgb(var(--accent)); background: rgba(0,210,255,.16); }
  .cbtn.listen { color: #ffd29a; border-color: rgba(255,190,110,.8); background: rgba(255,160,40,.13); box-shadow: 0 0 12px rgba(255,160,40,.3); }
  .cbtn.muted { color: #ff8a8a; border-color: rgba(255,90,90,.7); background: rgba(255,60,60,.12); box-shadow: 0 0 12px rgba(255,60,60,.3); }
  #askbox { display: none; pointer-events: auto; width: min(560px, 100%); }
  #askbox.open { display: flex; animation: msgin .2s ease; }
  #askbox input { flex: 1; height: 40px; padding: 0 14px; border: 1px solid rgb(var(--accent)); background: rgba(2,10,18,.94);
    color: #fff; font: 15px "Segoe UI", sans-serif; outline: none; box-shadow: 0 0 16px rgba(0,210,255,.25); }
  #askbox input::placeholder { color: var(--muted); }
  #askbox button { width: 44px; border: 1px solid rgb(var(--accent)); border-left: none; background: rgba(0,210,255,.16);
    color: #fff; cursor: pointer; font-size: 16px; }
  #hudbar { bottom: 10px; }

  /* ---------------- conversation sous la sphère (sa phrase puis la réponse), petit texte, sans boîte */
  #chat { position: fixed; left: calc(var(--sidew) + 40px); right: 40px; top: calc(50% + 27vmin); z-index: 3;
    display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; text-align: center;
    transition: left .2s ease; }
  .msg { max-width: min(760px, 100%); display: flex; gap: 8px; align-items: baseline; justify-content: center;
    animation: msgin .3s ease; transition: opacity .8s ease; overflow-wrap: anywhere;
    text-shadow: 0 0 2px #000, 0 1px 8px rgba(0,0,0,.95); }
  .msg .who { flex: none; font: 600 9.5px "Cascadia Mono", Consolas, monospace; letter-spacing: 2.5px; }
  .msg .tx { font-size: 14px; line-height: 1.45; display: -webkit-box; -webkit-box-orient: vertical;
    -webkit-line-clamp: 3; overflow: hidden; }
  .msg.user .who { color: #e0a85a; }
  .msg.user .tx { color: #ffd29a; font-style: italic; }
  .msg.jarvis .who { color: rgba(var(--accent), .9); }
  .msg.jarvis .tx { color: #9fe8ff; }
  .msg.live .tx::after { content: "▍"; color: rgb(var(--accent)); animation: blink 1s steps(2) infinite; margin-left: 4px; }
  .msg.gone { opacity: 0; }
  @keyframes msgin { from { opacity: 0; transform: translateY(10px); } }

<i class="rz n" data-e="n"></i><i class="rz s" data-e="s"></i><i class="rz e" data-e="e"></i><i class="rz w" data-e="w"></i>

<script>
// Déplacement NATIF par Windows (jarvis_window.Api.start_drag) au lieu de celui de pywebview, qui faisait
// disparaître la fenêtre pendant le glissé (surtout entre deux écrans d'échelles différentes).
window.addEventListener('pywebviewready', () => {
  const d = document.getElementById('drag');
  if (!d || !(window.pywebview && window.pywebview.api && window.pywebview.api.start_drag)) return;
  d.classList.remove('pywebview-drag-region');
  d.ondblclick = null;
  const grab = (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    if (e.detail >= 2) { send('win:toggle'); return; }   // double-clic : grand / petit
    window.pywebview.api.start_drag();
  };
  d.addEventListener('mousedown', grab);
  document.getElementById('tbar').addEventListener('mousedown', grab);   // le bandeau visible de la fenêtre réduite
  if (window.pywebview.api.start_resize) document.querySelectorAll('.rz').forEach(z => z.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    window.pywebview.api.start_resize(z.dataset.e);
  }));
});
</script>

      <span class="np-t1">0:00</span></div>

      <input type="range" min="0" max="100" step="1" value="100" title="Volume de l'appli (pas celui du PC)"><span>100</span></div>

</div>

  <button class="tbtn" id="btnModes" title="Choisir un mode (jeu, travail, musique…)" onclick="toggleModes()"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg><span>Modes</span></button>

  <button class="x" title="Fermer (JARVIS reste en arrière-plan)" onclick="send('win:close')"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
</div>
<button id="gear" title="Paramètres de JARVIS"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/><circle cx="12" cy="12" r="6.5"/></svg></button>
<div id="settings"><div class="sbox">
  <div class="shead"><img src="/logo.svg" alt=""><h1>PARAMÈTRES</h1>
    <span id="saved">✓ Enregistré</span>
    <button class="btn main" id="save">Enregistrer</button>
    <button class="btn" id="sclose">Fermer</button></div>
  <div id="sbody">Chargement…</div>
</div></div>
<script>window.JTOKEN = "__JTOKEN__";</script>

<script>
// ------------------------------------------------------------------ markdown minimal
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function inline(s) {
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
// graphique en barres : bloc ```chart {"labels":[...],"values":[...]} ```
function chartSvg(d) {
  const v = d.values || [], lab = d.labels || [], n = Math.max(1, v.length), max = Math.max(1, ...v);
  const W = 400, H = 150, pad = 18, bw = (W - 8) / n;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H + pad}">`;
  v.forEach((x, k) => {
    const h = Math.max(2, (x / max) * (H - 22)), xx = 4 + k * bw + bw * 0.15, w = bw * 0.7;
    s += `<rect x="${xx}" y="${H - h}" width="${w}" height="${h}" rx="3"></rect>`;
    s += `<text x="${xx + w / 2}" y="${H - h - 5}" class="cv">${x}</text>`;
    if (n <= 16 || k % 2 === 0) s += `<text x="${xx + w / 2}" y="${H + 13}" class="cl">${esc(String(lab[k] ?? ''))}</text>`;
  });
  return s + '</svg>';
}
function md(src) {
  const lines = src.replace(/\r/g, '').split('\n');
  let html = '', i = 0;
  while (i < lines.length) {
    let l = lines[i];
    if (/^```chart/.test(l)) {
      let js = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) js.push(lines[i++]);
      i++;
      try { html += chartSvg(JSON.parse(js.join('\n'))); } catch (e) { /* bloc incomplet (en cours d'écriture) */ }
      continue;
    }
    if (/^```/.test(l)) {
      let code = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]);
      html += `<pre><code>${esc(code.join('\n'))}</code></pre>`; i++; continue;
    }
    let h = l.match(/^(#{1,4})\s+(.*)/);
    if (h) { const n = Math.min(4, h[1].length + 1); html += `<h${n}>${inline(h[2])}</h${n}>`; i++; continue; }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)) { html += '<hr>'; i++; continue; }
    if (/^\s*\|.*\|\s*$/.test(l)) {
      let rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]);
      rows = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r))
                 .map(r => r.trim().slice(1, -1).split('|').map(c => inline(c.trim())));
      html += '<table>' + rows.map((r, k) => '<tr>' + r.map(c => k ? `<td>${c}</td>` : `<th>${c}</th>`).join('') + '</tr>').join('') + '</table>';
      continue;
    }
    if (/^\s*([-*•]|\d+[.)])\s+/.test(l)) {
      const ordered = /^\s*\d+[.)]/.test(l), start = ordered ? parseInt(l) : 1; let items = [];
      const item = /^\s*([-*•]|\d+[.)])\s+/;
      while (i < lines.length) {
        if (item.test(lines[i])) { items.push(lines[i++].replace(item, '')); continue; }
        // une ligne vide entre deux éléments ne coupe pas la liste
        let j = i; while (j < lines.length && !lines[j].trim()) j++;
        if (j > i && j < lines.length && item.test(lines[j])) { i = j; continue; }
        break;
      }
      html += (ordered ? `<ol start="${start}">` : '<ul>') + items.map(t => `<li>${inline(t)}</li>`).join('') + (ordered ? '</ol>' : '</ul>');
      continue;
    }
    if (/^>\s?/.test(l)) { html += `<blockquote>${inline(l.replace(/^>\s?/, ''))}</blockquote>`; i++; continue; }
    if (!l.trim()) { i++; continue; }
    let para = [];
    while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|```|\s*([-*•]|\d+[.)])\s|\s*\|)/.test(lines[i])) para.push(lines[i++]);
    html += para[0].startsWith('⏱') ? `<p class="foot">${inline(para.join(' '))}</p>`
                                    : `<p>${inline(para.join(' '))}</p>`;
  }
  return html;
}

// ------------------------------------------------------------------ petites fenêtres autour de la sphère
const cardsEl = document.getElementById('cards');
let screen = { active: null, panels: [] };
let lastChange = 0, zTop = 20, placed = 0;
const cardEls = new Map();  // id -> { el, body, len }

// largeur occupée à gauche par le panneau fixe (agenda, notes...) : la sphère et les fenêtres se placent à côté
const sideEl = document.getElementById('side');
function sideW() { return sideEl.offsetWidth ? sideEl.offsetWidth + 14 : 0; }

function slotFor(n) {
  // alternance gauche / droite ; sur chaque côté, les fenêtres se rangent les unes sous les autres
  // (sans se chevaucher ni cacher la sphère au centre) ; s'il n'y a plus de place : en cascade.
  const sw = sideW();
  const w = innerWidth < 1100 ? Math.max(180, (innerWidth - sw) * 0.25)   // tablette : panneaux plus étroits
                               : Math.max(280, Math.min(420, (innerWidth - sw) * 0.3));
  const left = n % 2 === 0;
  const x = left ? sw + 24 : innerWidth - w - 24;
  let y = 64;
  for (const { el } of cardEls.values()) {
    if (el.classList.contains('closing')) continue;
    const onSide = left ? el.offsetLeft < innerWidth / 2 : el.offsetLeft >= innerWidth / 2;
    if (onSide) y = Math.max(y, el.offsetTop + el.offsetHeight + 14);
  }
  if (y > innerHeight - 160) {  // côté plein : cascade par-dessus
    const k = Math.floor(n / 2) % 5;
    return { x: Math.max(8, x + (left ? k * 26 : -k * 26)), y: 64 + k * 54, w };
  }
  return { x: Math.max(8, x), y, w };
}

// Les fenêtres restent toujours visibles, même si JARVIS change de taille (plein écran <-> fenêtre).
function keepCardsInside() {
  for (const { el } of cardEls.values()) {
    const maxX = Math.max(sideW() + 8, innerWidth - el.offsetWidth - 8);
    const maxY = Math.max(8, innerHeight - el.offsetHeight - 8);
    el.style.left = Math.min(Math.max(sideW() + 8, el.offsetLeft), maxX) + 'px';
    el.style.top = Math.min(Math.max(8, el.offsetTop), maxY) + 'px';
  }
}
addEventListener('resize', keepCardsInside);
// le panneau de gauche s'agrandit / se réduit : les petites fenêtres qu'il recouvrirait sont poussées plus loin, au fil de l'animation
new ResizeObserver(() => { keepCardsInside(); if (window.fitTopctl) setTimeout(fitTopctl, 250); }).observe(sideEl);
// fenêtre réduite (pas plein écran) : bandeau + bords de redimensionnement ; fenêtre étroite : panneau de gauche réduit tout seul
let sideAuto = false;
function updWin() {
  const sc = window.screen, full = innerWidth >= sc.width - 24 && innerHeight >= sc.height - 24;   // (« screen » est une variable de la page : window.screen)
  document.body.classList.add('windowed');          // le bandeau « J.A.R.V.I.S » reste en plein écran aussi (2026-10-20)
  document.body.classList.toggle('isfull', full);
  if (typeof renderSide !== 'function' || typeof collapsed === 'undefined') return;
  if (innerWidth < 1000 && !collapsed) { collapsed = true; sideAuto = true; document.body.classList.add('collapsed'); renderSide(); }
  else if (innerWidth >= 1150 && sideAuto && collapsed) { collapsed = false; sideAuto = false; document.body.classList.remove('collapsed'); renderSide(); }
}
addEventListener('resize', updWin);
setTimeout(updWin, 400); setTimeout(updWin, 1500);

function makeCard(p) {
  const el = document.createElement('div');
  el.className = 'card hudbox';
  const pos = slotFor(placed++);
  Object.assign(el.style, { left: pos.x + 'px', top: pos.y + 'px', width: pos.w + 'px', zIndex: ++zTop });
  el.innerHTML = '<div class="chead"><span class="ctitle"></span><button class="cx" title="Fermer">✕</button></div>'
               + '<div class="cbody mdc"></div><span class="cn1"></span><span class="cn2"></span>';
  el.querySelector('.ctitle').textContent = p.title;
  if (p.title.startsWith('Tâche')) el.classList.add('task');
  el.querySelector('.cx').onclick = (e) => { e.stopPropagation(); el.classList.add('closing'); send('close:' + p.id); };
  const head = el.querySelector('.chead');
  head.addEventListener('pointerdown', (e) => {
    if (e.target.classList.contains('cx')) return;
    el.style.zIndex = ++zTop;
    head.setPointerCapture(e.pointerId);
    const dx = e.clientX - el.offsetLeft, dy = e.clientY - el.offsetTop;
    const move = (ev) => {  // la fenêtre reste entière à l'écran, à droite du panneau de gauche
      const maxX = Math.max(sideW() + 8, innerWidth - el.offsetWidth - 8);
      const maxY = Math.max(8, innerHeight - el.offsetHeight - 8);
      el.style.left = Math.max(sideW() + 8, Math.min(maxX, ev.clientX - dx)) + 'px';
      el.style.top = Math.max(8, Math.min(maxY, ev.clientY - dy)) + 'px';
    };
    const up = () => { head.removeEventListener('pointermove', move); head.removeEventListener('pointerup', up); };
    head.addEventListener('pointermove', move);
    head.addEventListener('pointerup', up);
  });
  el.addEventListener('pointerdown', () => { el.style.zIndex = ++zTop; });
  cardsEl.appendChild(el);
  requestAnimationFrame(() => el.classList.add('shown'));
  return { el, body: el.querySelector('.cbody'), len: -1 };
}

function renderScreen() {
  const ids = new Set(screen.panels.map(p => p.id));
  for (const [id, c] of cardEls) {
    if (!ids.has(id)) { c.el.classList.add('closing'); setTimeout(() => c.el.remove(), 260); cardEls.delete(id); }
  }
  if (!cardEls.size) placed = 0;
  for (const p of screen.panels) {
    let c = cardEls.get(p.id);
    if (!c) {
      c = makeCard(p); cardEls.set(p.id, c);
      if (pageTab) openPage(null);  // JARVIS montre quelque chose : la page ne doit pas le cacher
    }
    if (c.len !== p.md.length) {
      if (c.len >= 0 && p.id === screen.active) c.el.style.zIndex = ++zTop;  // mise à jour : elle repasse devant
      const b = c.body, atBottom = b.scrollTop + b.clientHeight >= b.scrollHeight - 30;
      b.innerHTML = md(p.md) + (Date.now() - lastChange < 1500 ? '<span class="cursor"></span>' : '');
      if (atBottom && c.len >= 0) b.scrollTop = b.scrollHeight;  // suit l'écriture en direct
      c.len = p.md.length;
    }
  }
}
setInterval(() => {
  if (Date.now() - lastChange > 1500) {
    for (const c of cardEls.values()) if (c.body.querySelector('.cursor')) { c.len = -1; }
    renderScreen();
  }
}, 600);

// ------------------------------------------------------------------ paramètres de JARVIS
const ACT_TYPES = [['close', 'Fermer (applis, Edge...)'], ['app', 'Application'], ['url', 'Site web'], ['game', 'Jeu'], ['music', 'Musique'],
                   ['keys', 'Touches'], ['volume', 'Volume (monte/baisse)'], ['say', 'Phrase à dire'],
                   ['arrange', 'Ranger les fenêtres (quadrants, côte à côte, colonnes)']];
let S = null, settingsShown = false;
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'on') { for (const [ev, f] of Object.entries(v)) e.addEventListener(ev, f); }
    else if (k === 'style' || k.startsWith('data')) e.setAttribute(k, v);
    else e[k] = v;
  }
  for (const k of kids) e.append(k);
  return e;
}
function api(path, body) {
  return fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({ token: window.JTOKEN }, body)) }).then(r => r.json());
}

function actRow(list, a) {
  const type = Object.keys(a).find(k => ACT_TYPES.some(t => t[0] === k)) || 'app';
  const sel = el('select', {}, ...ACT_TYPES.map(([v, l]) => el('option', { value: v, textContent: l, selected: v === type })));
  const inp = el('input', { type: 'text', value: a[type] ?? '', placeholder: 'ex : Discord, https://..., Warzone' });
  const row = el('div', { className: 'act' }, sel, inp,
    el('button', { className: 'btn del', textContent: '✕', on: { click: () => row.remove() } }));
  row.read = () => ({ [sel.value]: inp.value.trim() });
  list.append(row);
}
function actEditor(actions) {
  const list = el('div');
  (actions || []).forEach(a => actRow(list, a));
  const box = el('div', {}, list, el('button', { className: 'btn', textContent: '+ Ajouter une action',
    on: { click: () => actRow(list, {}) } }));
  box.read = () => [...list.children].map(r => r.read()).filter(a => Object.values(a)[0] !== '' || 'music' in a);
  return box;
}
function section(title, hint, ...kids) {
  return el('div', { className: 'sec' }, el('h2', { textContent: title }), el('p', { className: 'hint', textContent: hint }), ...kids);
}

function renderSettings() {
  const body = document.getElementById('sbody');
  body.innerHTML = '';
  // Général
  const inputs = {};
  const gen = S.fields.map(f => {
    let inp;
    if (f.type === 'bool') inp = el('input', { type: 'checkbox', checked: !!f.value });
    else if (f.type === 'number') inp = el('input', { type: 'number', step: 'any', value: f.value });
    else if (f.type === 'select') inp = el('select', {}, ...f.options.map(([v, l]) => el('option', { value: v, textContent: l, selected: v === f.value })));
    else if (f.type === 'voice') {
      inp = el('select', {}, ...(S.live_voices || []).map(([v, l]) => el('option', { value: v, textContent: l, selected: v === f.value })));
      const sel = inp;
      inp = el('span', {}, sel, el('button', { className: 'btn', textContent: '▶ Écouter', style: 'margin-left:8px',
        on: { click: () => api('/api/run', { what: 'preview_voice', voice: sel.value }) } }));
      inp.value = sel.value;
      Object.defineProperty(inp, 'value', { get: () => sel.value });
    }
    else if (f.type === 'mic' || f.type === 'clapmic') {
      // choix du micro + test (3 s d'écoute) ; pour les claquements : calibrage et test en direct en plus
      const mics = S.mics || [];
      // micro d'écouteurs Bluetooth : l'ouvrir les fait passer en « kit main-libre » (bruits de connexion, son coupé)
      const headset = (m) => /casque|headset|buds|airpods|mains libres|hands-free|bluetooth/i.test(m);
      const opts = [['', f.options]].concat(mics.map(m => [m, headset(m) ? m + ' — ⚠ déconseillé (coupe le son des écouteurs)' : m]));
      if (f.value && !mics.includes(f.value)) opts.push([f.value, f.value + ' (débranché)']);
      const sel = el('select', { style: 'max-width:440px' },
        ...opts.map(([v, l]) => el('option', { value: v, textContent: l, selected: v === (f.value || '') })));
      const res = el('div', { className: 'hint', style: 'margin:4px 0 0;flex-basis:100%',
        textContent: f.type === 'mic' && S.mic_used ? 'En ce moment : ' + S.mic_used : '' });
      const clap = f.type === 'clapmic';
      const test = el('button', { className: 'btn', textContent: '🎙 Tester', on: { click: async () => {
        res.className = 'hint'; res.textContent = (clap ? 'Tape dans tes mains' : 'Parle') + ' pendant 3 secondes…';
        const r = await api('/api/run', { what: 'test_mic', device: sel.value, clap });
        if (r.error) { res.className = 'ko'; res.textContent = 'Test impossible : ' + r.error; return; }
        if (r.dead) { res.className = 'ko'; res.textContent = `⚠ Aucun son reçu de « ${r.name} » : micro inactif (écouteurs rangés, coupés ou pas en mode micro ?).`; return; }
        if (r.peak < 0.0005) { res.className = 'ko'; res.textContent = `⚠ « ${r.name} » : silence total. Micro coupé ? Vérifie la touche « micro » du clavier (voyant allumé = coupé).`; return; }
        const q = r.peak < 0.01 ? ['ko', 'presque rien : rapproche-toi ou monte le volume du micro'] : r.peak < 0.05 ? ['ko', 'faible']
          : ['ok', 'bon'];
        res.className = q[0]; res.textContent = `${q[0] === 'ok' ? '✓' : '⚠'} « ${r.name} » : niveau max ${r.peak.toFixed(2)} — ${q[1]}.`;
      } } });
      const extra = clap ? [
        el('button', { className: 'btn', textContent: '⚙ Calibrer', title: 'Enregistre 4 claquements et règle la sensibilité',
          on: { click: async () => { await save(); api('/api/run', { what: 'clap_calibrate' }); } } }),
        el('button', { className: 'btn', textContent: '▶ Test en direct', title: 'Fenêtre qui affiche chaque claquement entendu',
          on: { click: async () => { await save(); api('/api/run', { what: 'clap_test' }); } } })] : [];
      inp = el('span', { style: 'display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:1 1 440px' }, sel, test, ...extra, res);
      Object.defineProperty(inp, 'value', { get: () => sel.value });
    }
    else if (f.type === 'out') {
      // sortie son de JARVIS + test (petite mélodie)
      const outs = S.outs || [];
      const opts = [['', f.options]].concat(outs.map(m => [m, m]));
      if (f.value && !outs.includes(f.value)) opts.push([f.value, f.value + ' (débranchée)']);
      const sel = el('select', { style: 'max-width:440px' },
        ...opts.map(([v, l]) => el('option', { value: v, textContent: l, selected: v === (f.value || '') })));
      const res = el('div', { className: 'hint', style: 'margin:4px 0 0;flex-basis:100%' });
      const test = el('button', { className: 'btn', textContent: '🔊 Tester le son', on: { click: async () => {
        res.className = 'hint'; res.textContent = 'Écoute : trois petites notes…';
        const r = await api('/api/run', { what: 'test_out', device: sel.value });
        if (r.error) { res.className = 'ko'; res.textContent = 'Test impossible : ' + r.error; return; }
        res.className = 'hint'; res.textContent = `Joué sur « ${r.name} ». Rien entendu ? Vérifie que cette sortie n'est pas coupée `
          + '(icône du son en bas à droite de Windows) et, pour des écouteurs, qu’ils sont bien dans tes oreilles.';
      } } });
      inp = el('span', { style: 'display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:1 1 440px' }, sel, test, res);
      Object.defineProperty(inp, 'value', { get: () => sel.value });
    }
    else if (f.type === 'gemini') inp = el('select', {}, el('option', { value: '', textContent: 'Automatique (Flash le plus récent)' }),
        ...S.gemini_models.map(m => el('option', { value: m, textContent: m, selected: m === f.value })));
    else inp = el('input', { type: 'text', value: f.value ?? '' });
    inputs[f.key] = inp;
    return el('div', { className: 'row' }, el('label', { className: 'l', textContent: f.label }), inp);
  });
  body.append(section('Général', 'Ta voix, son cerveau et son comportement.', ...gen));

  // Au lancement
  const startup = actEditor(S.startup_open);
  body.append(section('Au lancement de JARVIS', 'Ce qu’il ouvre automatiquement à chaque démarrage.', startup,

function grouped(items, dayOf, row) {

// résumé de chaque onglet : [petite ligne, pastille, pastille orange ?]
function tabInfo(k, d) {
  if (k === 'agenda') {
    const a = d.agenda;
    if (!a) return ['Chargement…'];
    if (!a.ok) return ['Non connecté'];
    const now = new Date().toTimeString().slice(0, 5);
    const today = a.events.filter(e => e.today), next = today.find(e => e.time === 'Journée' || e.time >= now);
    return [next ? `${next.time} · ${next.title}` : today.length ? 'Fini pour aujourd’hui' : 'Rien aujourd’hui', today.length || ''];
  }
  if (k === 'rappels') {
    const r = d.reminders, today = r.filter(x => x.day === "Aujourd'hui");
    return [r.length ? `${r[0].day === "Aujourd'hui" ? '' : r[0].day + ' '}${r[0].time} · ${r[0].text}` : 'Aucun rappel', today.length || ''];
  }
  if (k === 'notes') return [d.notes.length ? d.notes[0].title : 'Aucune note', ''];
  if (k === 'pcradar') {
    const p = d.pcradar;
    if (!p) return ['Chargement…'];
    if (!p.ok) return ['Non connecté'];
    const todo = (p.tickets || 0) + (p.suspects || 0);
    return [`${fmt(p.today)} visiteurs aujourd’hui`, todo || '', true];
  }
  if (k === 'apis') return ['Brancher des services', ''];
  if (k === 'deck') return ['Boutons stream, musique, raccourcis', ''];
  if (k === 'imprimante') { const p = d.printer || {}; return [p.line || '…', '', p.state === 'error']; }
  if (k === 'agents') {
    if (!AG) return ['Patron + 5 spécialistes', ''];
    const busy = AG.agents.filter(a => a.busy && a.key !== 'patron').length;
    const wait = AG.jobs.filter(j => j.agent === 'patron' && j.status === 'a_confirmer').length;
    return [busy ? `${busy} agent${busy > 1 ? 's' : ''} au travail` : 'Équipe disponible', busy || wait || '', !!wait];
  }
  if (k === 'dash') return ['Météo, PC Radar, mails, musique', ''];
  if (k === 'camera') return [window.CAM3D && CAM3D.isOpen() ? 'Ouverte' : 'Écran avec les doigts · formes 3D', ''];
  if (k === 'clips') {
    const c = d.clips || { count: 0 };
    return [c.count ? `Dernier : ${c.last}` : 'Aucun clip', c.count ? (c.count > 99 ? '99+' : c.count) : ''];
  }
  const m = d.mails;
  if (!m) return ['Chargement…'];
  if (!m.ok) return ['Non configuré'];
  const n = m.boxes.reduce((s, b) => s + (b.count || 0), 0);
  return [n ? `${n.toLocaleString('fr-FR')} non lu${n > 1 ? 's' : ''}` : 'Aucun non lu', n ? (n > 99 ? '99+' : n) : ''];
}

function renderHudbar() {
  if (!hudReady) return;
  const d = DASH || {}, label = (LABELS[state] || 'SYSTÈMES EN LIGNE');
  const micOff = !!d.quiet || state === 'paused' || micMuted;
  const key = [label, micOff, micMuted, listenAll, d.quiet, d.updated, d.pcradar && d.pcradar.today].join('|');
  if (key === hudKey) return;
  hudKey = key;
  const bar = document.getElementById('hudbar');
  const item = (html) => el('span', { innerHTML: html });
  const sep = (opt) => el('span', { className: 'sep' + (opt ? ' opt' : '') });
  const opt = (html) => el('span', { className: 'opt', innerHTML: html });  // masqués quand la fenêtre est petite
  const parts = [item('<b>J.A.R.V.I.S</b>'), sep(), item(esc(label)), sep(),
    item(`<span class="dot${micOff ? ' off' : ''}"></span>MICRO ${micOff ? (micMuted ? 'COUPÉ' : d.quiet ? 'COUPÉ · COURS' : 'EN PAUSE') : 'ACTIF'}`)];

let clipSel = null;

function clipPost(path, id) {

    body: JSON.stringify({ token: window.JTOKEN, id }) }).then(r => r.json());

function renderClips() {
  pageShell('Clips', 'Chargement…', [sempty('Chargement des clips…')]);

    if (pageTab !== 'clips') return;

    const grid = el('div', { className: 'cgrid' });

      clipSel = c.id;
      grid.querySelectorAll('.ccard').forEach(x => x.classList.toggle('on', x.dataset.id === c.id));
      player.poster = '/api/clips/thumb?id=' + encodeURIComponent(c.id) + '&' + tokq();

      title.replaceChildren(el('b', { textContent: c.name }), el('small', { textContent: `${c.date} · ${c.mb} Mo · ${c.folder}` }));
      del.textContent = 'Supprimer'; del.dataset.armed = '';

        if (!del.dataset.armed) { del.dataset.armed = '1'; del.textContent = 'Confirmer : à la corbeille'; return; }
        player.removeAttribute('src'); player.load();
        clipPost('/api/clips/delete', c.id).then(x => {

const chatEl = document.getElementById('chat');
const chatEls = new Map();  // id -> élément
let chatShow = true;
function renderChat(d) {
  chatShow = d.show !== false;
  chatEl.style.display = chatShow ? '' : 'none';
  const ids = new Set();
  // seulement le dernier échange : sa phrase, puis la réponse de JARVIS en dessous
  const items = d.items || [], last = items[items.length - 1];
  const shown = !last ? [] : (last.role === 'jarvis' && items.length > 1 && items[items.length - 2].role === 'user')
    ? items.slice(-2) : [last];
  for (const m of shown) {
    if (chatGone.get(m.id) === m.text) continue;  // déjà effacé (et rien de nouveau dedans)
    ids.add(m.id);
    let e = chatEls.get(m.id);
    if (!e) {
      e = el('div', { className: 'msg ' + m.role },
        el('div', { className: 'who', textContent: m.role === 'user' ? 'TOI' : 'J.A.R.V.I.S' }), el('div', { className: 'tx' }));
      chatEls.set(m.id, e);
      chatEl.append(e);
    }
    const t = m.text.length > 260 ? '… ' + m.text.slice(-260) : m.text;  // longue réponse : la fin, qui avance
    const tx = e.querySelector('.tx');
    if (tx.textContent !== t || e.dataset.done !== String(!!m.done)) e._upd = Date.now();  // dernière nouveauté
    tx.textContent = t;
    e.dataset.full = m.text;
    e.dataset.done = String(!!m.done);
    e.classList.toggle('long', m.role === 'jarvis' && m.text.length > 160);
    e.classList.toggle('live', !m.done);
    e.classList.remove('gone');
  }
  for (const [id, e] of chatEls) if (!ids.has(id)) { e.remove(); chatEls.delete(id); }

// l'échange s'efface tout seul : 8 s après la dernière nouveauté (même si JARVIS n'a pas répondu et que le message
// est resté « en cours »), une seule fois : il ne revient pas tant que le texte ne change pas
const chatGone = new Map();  // id -> texte au moment de l'effacement
setInterval(() => {
  const els = [...chatEls.entries()];
  if (!els.length) return;
  const last = Math.max(...els.map(([, e]) => e._upd || 0));
  const wait = els.every(([, e]) => e.dataset.done === 'true') ? 8000 : 12000;
  if (Date.now() - last < wait) return;
  for (const [id, e] of els) {
    chatGone.set(id, e.dataset.full);
    e.classList.add('gone');
    setTimeout(() => { e.remove(); chatEls.delete(id); }, 900);
  }

  } else {
    // état (« À L'ÉCOUTE »...) et action rapide en cours (« J'ouvre Discord »)
    ctx.font = `600 ${Math.round(fs * 0.68)}px "Bahnschrift", "Segoe UI", sans-serif`;
    ctx.fillStyle = `rgba(${r},${g},${b},0.85)`;
    const lab = (LABELS[state] || '').split('').join(String.fromCharCode(8202));  // lettres espacées
    ctx.fillText(lab, ox, oy + ob * 2.05 + fs * 0.6);
    if (taskLabel) {
      ctx.font = `${fs}px "Segoe UI", sans-serif`;
      ctx.fillStyle = 'rgba(235,245,250,0.9)';
      ctx.fillText(taskLabel.length > 60 ? taskLabel.slice(0, 58) + '…' : taskLabel, ox, oy + ob * 2.05 + fs * 1.9);
    }
  }
}
requestAnimationFrame(frame);

// ---- horloge en haut, façon interface Stark
const JOURS = ['DIMANCHE', 'LUNDI', 'MARDI', 'MERCREDI', 'JEUDI', 'VENDREDI', 'SAMEDI'];
const MOIS = ['JANVIER', 'FÉVRIER', 'MARS', 'AVRIL', 'MAI', 'JUIN', 'JUILLET', 'AOÛT', 'SEPTEMBRE', 'OCTOBRE',
              'NOVEMBRE', 'DÉCEMBRE'];
function tickClock() {
  const d = new Date(), p = (n) => String(n).padStart(2, '0');
  document.getElementById('clk-hm').textContent = `${p(d.getHours())}:${p(d.getMinutes())}`;
  document.getElementById('clk-s').textContent = p(d.getSeconds());
  document.getElementById('clk-d').textContent = `${JOURS[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()]} ${d.getFullYear()}`;
}
tickClock();
setInterval(tickClock, 1000);
</script>
