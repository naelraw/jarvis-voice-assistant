<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>JARVIS</title>
<!-- Écran de chargement (fenêtre ouverte avant que JARVIS ait fini de démarrer). Mêmes couleurs, polices, sphère et
     anneaux que l'interface (index.html) : bleu cyan uniquement. Autonome : rien à télécharger. -->
<style>
  :root { --bg: #02060c; --accent: 0, 210, 255; --text: #d6ecf5; --muted: #7d98a8;
    --hud: "Bahnschrift", "Segoe UI", sans-serif; --mono: "Cascadia Mono", "Consolas", monospace; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif; user-select: none; }
  body::before { /* même quadrillage que l'interface */
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .5; z-index: 1;
    background-image: linear-gradient(rgba(0,210,255,.035) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(0,210,255,.035) 1px, transparent 1px);
    background-size: 48px 48px; mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%); }
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #frame { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
  #frame i { position: absolute; width: 46px; height: 46px; border: 0 solid rgba(0,210,255,.45); }
  #frame i:nth-child(1) { top: 6px; left: 6px; border-top-width: 1px; border-left-width: 1px; }
  #frame i:nth-child(2) { top: 6px; right: 6px; border-top-width: 1px; border-right-width: 1px; }
  #frame i:nth-child(3) { bottom: 6px; left: 6px; border-bottom-width: 1px; border-left-width: 1px; }
  #frame i:nth-child(4) { bottom: 6px; right: 6px; border-bottom-width: 1px; border-right-width: 1px; }

  #title { position: fixed; top: 6vh; left: 0; right: 0; text-align: center; z-index: 3; font-family: var(--hud); }
  #title .n { font-size: clamp(26px, 5vmin, 52px); font-weight: 300; letter-spacing: .5em; padding-left: .5em;
    color: #e8f6ff; text-shadow: 0 0 18px rgba(0,210,255,.5); }
  #title .d { margin-top: 10px; font: clamp(9px, 1.3vmin, 11px) var(--mono); letter-spacing: 5px;
    color: rgba(var(--accent), .85); }

  #status { position: fixed; left: 50%; bottom: 7vh; transform: translateX(-50%); width: min(520px, 78vw); z-index: 3; }
  #hud { display: flex; align-items: center; justify-content: center; gap: 14px; font: 11px var(--mono);
    letter-spacing: 2px; text-transform: uppercase; color: rgba(var(--accent), .75); white-space: nowrap; }
  #hud .sep { flex: 0 0 34px; height: 1px; background: rgba(0,210,255,.35); }
  #hud b { color: #e8f6ff; font-weight: 400; }
  #bar { position: relative; height: 2px; margin-top: 12px; background: rgba(0,210,255,.14); overflow: hidden; }
  #bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgb(var(--accent));
    box-shadow: 0 0 10px rgba(0,210,255,.8); }
  #log { margin-top: 12px; height: 5.4em; overflow: hidden; font: 10.5px/1.8 var(--mono); color: var(--muted);
    letter-spacing: .06em; text-align: center;
    -webkit-mask-image: linear-gradient(180deg, transparent, #000 45%); mask-image: linear-gradient(180deg, transparent, #000 45%); }
  #log .ok::after { content: "  ·  OK"; color: rgb(var(--accent)); }
  #log .cur { color: #e8f6ff; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="frame"><i></i><i></i><i></i><i></i></div>
<div id="title"><div class="n">J.A.R.V.I.S</div><div class="d">INITIALISATION DES SYSTÈMES</div></div>
<div id="status">
  <div id="hud"><span>J.A.R.V.I.S</span><span class="sep"></span><span id="stage">Démarrage</span><span class="sep"></span><b id="pct">0 %</b></div>
  <div id="bar"><i id="fill"></i></div>
  <div id="log"></div>
</div>
<script>
const DUREE = parseFloat('__DUREE__') || 15, T0 = performance.now();   // durée prévue du chargement (s)
let done = false, pct = 0, etape = 0, tEtape = 0, shown = 0;

// ---- sphère : la même que l'interface (points de Fibonacci reliés à leurs voisins, anneaux, arcs, satellites)
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H;
function resize() { const d = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
addEventListener('resize', resize); resize();
const NP = 320, PTS = [], EDGES = [];
for (let i = 0; i < NP; i++) {
  const y = 1 - (i / (NP - 1)) * 2, rad = Math.sqrt(1 - y * y), th = i * 2.399963;
  PTS.push({ x: Math.cos(th) * rad, y, z: Math.sin(th) * rad, ph: Math.random() * 6.283 });
}
{ const seen = new Set();
  for (let i = 0; i < NP; i++) {
    const d = [];
    for (let j = 0; j < NP; j++) if (j !== i) d.push([(PTS[i].x - PTS[j].x) ** 2 + (PTS[i].y - PTS[j].y) ** 2 + (PTS[i].z - PTS[j].z) ** 2, j]);
    d.sort((u, v) => u[0] - v[0]);
    for (let k = 0; k < 3; k++) { const j = d[k][1], key = i < j ? i * 1000 + j : j * 1000 + i;
      if (!seen.has(key)) { seen.add(key); EDGES.push([i, j]); } }
  } }
const P = new Float32Array(NP * 3);
let t = 0, col = [80, 100, 130];
const c = (a) => `rgba(${col[0]},${col[1]},${col[2]},${a})`;

function rings(ox, oy, R) {
  ctx.save(); ctx.translate(ox, oy);
  // anneau gradué
  const rt = R * 1.5;
  ctx.beginPath(); ctx.arc(0, 0, rt, 0, Math.PI * 2); ctx.strokeStyle = c(0.16); ctx.lineWidth = 1; ctx.stroke();
  ctx.beginPath();
  for (let k = 0; k < 120; k++) {
    const a = (k / 120) * Math.PI * 2 + t * 0.03, L = k % 10 === 0 ? 11 : k % 5 === 0 ? 6 : 3;
    ctx.moveTo(Math.cos(a) * rt, Math.sin(a) * rt); ctx.lineTo(Math.cos(a) * (rt + L), Math.sin(a) * (rt + L));
  }
  ctx.strokeStyle = c(0.38); ctx.stroke();
  // arcs qui tournent (plus vite qu'au repos : il travaille)
  ctx.lineCap = 'round';
  const arcs = [[R * 1.65, 0.9, [[0, 0.9], [1.5, 2.3], [3.4, 4.7], [5.2, 5.6]], 2.2, 0.6],
                [R * 1.33, -1.4, [[0.3, 1.4], [2.6, 3.0], [4.0, 5.5]], 1.2, 0.45],
                [R * 1.8, 0.3, [[0, 0.25], [1.05, 1.3], [2.1, 2.35], [3.15, 3.4], [4.2, 4.45], [5.25, 5.5]], 3, 0.35]];
  for (const [rr, sp, segs, w, al] of arcs) {
    ctx.beginPath();
    for (const [s0, s1] of segs) { ctx.moveTo(Math.cos(s0 + t * sp) * rr, Math.sin(s0 + t * sp) * rr);
      ctx.arc(0, 0, rr, s0 + t * sp, s1 + t * sp); }
    ctx.strokeStyle = c(al); ctx.lineWidth = w; ctx.stroke();
  }
  // progression : arc lumineux autour de la sphère (de midi, dans le sens des aiguilles)
  const rp = R * 1.95, a0 = -Math.PI / 2;
  ctx.beginPath(); ctx.arc(0, 0, rp, 0, Math.PI * 2); ctx.strokeStyle = c(0.1); ctx.lineWidth = 3; ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, rp, a0, a0 + (pct / 100) * Math.PI * 2);
  ctx.strokeStyle = 'rgba(160,236,255,0.95)'; ctx.lineWidth = 3; ctx.shadowColor = 'rgba(0,210,255,.9)'; ctx.shadowBlur = 12;
  ctx.stroke(); ctx.shadowBlur = 0;
  const ae = a0 + (pct / 100) * Math.PI * 2;
  ctx.beginPath(); ctx.arc(Math.cos(ae) * rp, Math.sin(ae) * rp, 3.5, 0, Math.PI * 2); ctx.fillStyle = '#e8f6ff'; ctx.fill();
  ctx.lineCap = 'butt';
  for (let k = 0; k < 3; k++) {  // satellites
    const a = t * 0.9 + k * 2.094, rr = R * 1.65;
    ctx.beginPath(); ctx.arc(Math.cos(a) * rr, Math.sin(a) * rr, 2.6, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${Math.min(255, col[0] + 120)},${Math.min(255, col[1] + 60)},255,0.95)`; ctx.fill();
  }
  ctx.beginPath();  // repères en croix
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { ctx.moveTo(dx * R * 2.1, dy * R * 2.1); ctx.lineTo(dx * R * 2.22, dy * R * 2.22); }
  ctx.strokeStyle = c(0.5); ctx.lineWidth = 1.5; ctx.stroke();
  ctx.restore();
}

function frame() {
  requestAnimationFrame(frame);
  t += 1 / 60;
  // la couleur passe du gris-bleu « chargement » au bleu « en ligne » à mesure que ça avance
  const tg = done ? [30, 140, 255] : [80 - pct * 0.4, 100 + pct * 0.3, 130 + pct * 1.1];
  for (let i = 0; i < 3; i++) col[i] += (tg[i] - col[i]) * 0.05;
  col = col.map((v) => Math.round(v * 10) / 10);
  const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
  g.addColorStop(0, '#08172a'); g.addColorStop(0.5, '#040b17'); g.addColorStop(1, '#010309');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const ox = W / 2, oy = H * 0.47, R = Math.min(W, H) * 0.135;
  const halo = ctx.createRadialGradient(ox, oy, R * 0.2, ox, oy, R * 2.2);
  halo.addColorStop(0, c(0.18)); halo.addColorStop(0.5, c(0.04)); halo.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = halo; ctx.fillRect(ox - R * 2.2, oy - R * 2.2, R * 4.4, R * 4.4);
  rings(ox, oy, R);
  const ay = t * 0.6, ax = 0.35 + Math.sin(t * 0.21) * 0.18;
  const cy = Math.cos(ay), sy = Math.sin(ay), cx = Math.cos(ax), sx = Math.sin(ax);
  for (let i = 0; i < NP; i++) {
    const p = PTS[i], wob = 1 + Math.sin(t * 1.3 + p.ph) * 0.012;
    const x = p.x * wob, y = p.y * wob, z = p.z * wob;
    const x1 = x * cy + z * sy, z1 = -x * sy + z * cy, y1 = y * cx - z1 * sx, z2 = y * sx + z1 * cx;
    const k = 1 / (1 - z2 * 0.32);
    P[i * 3] = ox + x1 * R * k; P[i * 3 + 1] = oy + y1 * R * k; P[i * 3 + 2] = z2;
  }
  ctx.globalCompositeOperation = 'lighter';
  const bucket = [[], [], []];
  for (const [i, j] of EDGES) { const z = (P[i * 3 + 2] + P[j * 3 + 2]) / 2; bucket[z < -0.25 ? 0 : z < 0.3 ? 1 : 2].push(i, j); }
  const ea = [0.07, 0.17, 0.36];
  for (let bk = 0; bk < 3; bk++) {
    const L = bucket[bk]; ctx.beginPath();
    for (let n = 0; n < L.length; n += 2) { const i = L[n] * 3, j = L[n + 1] * 3; ctx.moveTo(P[i], P[i + 1]); ctx.lineTo(P[j], P[j + 1]); }
    ctx.strokeStyle = c(ea[bk]); ctx.lineWidth = bk === 2 ? 1.1 : 0.8; ctx.stroke();
  }
  for (let bk = 0; bk < 3; bk++) {
    ctx.beginPath();
    for (let i = 0; i < NP; i++) {
      const z = P[i * 3 + 2], zb = z < -0.25 ? 0 : z < 0.3 ? 1 : 2;
      if (zb !== bk) continue;
      const s = 0.8 + (z + 1) * 0.9;
      ctx.moveTo(P[i * 3] + s, P[i * 3 + 1]); ctx.arc(P[i * 3], P[i * 3 + 1], s, 0, Math.PI * 2);
    }
    ctx.fillStyle = bk === 2 ? `rgba(${Math.min(255, col[0] + 120)},${Math.min(255, col[1] + 60)},255,0.85)` : c(bk ? 0.55 : 0.25);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}
requestAnimationFrame(frame);

// ---- progression : réglée sur la durée du dernier chargement ; 100 % quand JARVIS est prêt (jarvisPret)
const STEPS = ['Noyau JARVIS', 'Liaison audio', 'Reconnaissance vocale', 'Liaison Gemini Live',
               'Agenda, mails et PC Radar', 'Écrans et tablette', 'Interface'];
const logEl = document.getElementById('log'), stageEl = document.getElementById('stage');
const fillEl = document.getElementById('fill'), pctEl = document.getElementById('pct');
let step = 0;
function addLine(txt) {
  if (logEl.lastChild) logEl.lastChild.className = 'ok';
  const d = document.createElement('div'); d.textContent = txt; d.className = 'cur';
  logEl.appendChild(d); while (logEl.children.length > 3) logEl.firstChild.remove();
}
function next() {
  if (done) return;
  // le texte ne prend jamais d'avance sur les vraies étapes (au plus une étape devant)
  if (step < STEPS.length && step <= etape) { addLine(STEPS[step]); stageEl.textContent = STEPS[step]; step++; }
  setTimeout(next, (DUREE * 1000 / STEPS.length) * (0.75 + Math.random() * 0.5));
}
next();
// Barre guidée par le VRAI chargement : JARVIS signale 6 étapes (jarvisEtape), et la fenêtre a gardé à quel moment
// (en part du total) chacune était arrivée au démarrage précédent (PROFIL). Entre deux étapes, la barre avance au
// rythme prévu ; une étape réelle la recale ; elle ne recule jamais et monte toujours en douceur (pas de saut à 100 %).
let PROFIL = {};
try { PROFIL = JSON.parse('__PROFIL__'); } catch (e) {}
const FRAC = [0, 0.08, 0.35, 0.6, 0.72, 0.8, 0.88];          // valeurs par défaut (avant la 1re mesure)
for (let n = 1; n <= 6; n++) if (PROFIL[n] > 0 && PROFIL[n] < 1) FRAC[n] = PROFIL[n];
// (etape, tEtape, shown : déclarés en haut, next() les utilise avant cette ligne)
window.jarvisEtape = (n) => {
  if (n <= etape) return;
  etape = Math.min(6, n); tEtape = (performance.now() - T0) / 1000;
  while (step < Math.min(etape, STEPS.length)) { addLine(STEPS[step]); stageEl.textContent = STEPS[step]; step++; }
};
function progress() {
  const el = (performance.now() - T0) / 1000;
  let target;
  if (done) target = 100;
  else {
    const f0 = etape ? FRAC[etape] : 0, f1 = etape < 6 ? FRAC[etape + 1] : 0.99;
    const gap = Math.max(0.3, (f1 - f0) * DUREE);                 // durée prévue jusqu'à l'étape suivante
    const k = Math.min(1, (el - tEtape) / gap);
    target = 100 * (f0 + (f1 - f0) * (k < 1 ? k * 0.9 : 0.9 + 0.09 * (1 - Math.exp(-(el - tEtape - gap)))));
    target = Math.max(target, Math.min(100 * f1 - 1, 85 * el / DUREE));  // étape en retard : avance quand même un peu
    target = Math.min(target, 99);
  }
  shown += (Math.max(shown, target) - shown) * (done ? 0.18 : 0.08);  // douceur, jamais en arrière
  pct = shown;
  fillEl.style.width = shown.toFixed(1) + '%'; pctEl.textContent = Math.floor(shown + (done ? 0.5 : 0)) + ' %';
  if (!(done && shown > 99.5)) requestAnimationFrame(progress);
  else { fillEl.style.width = '100%'; pctEl.textContent = '100 %'; }
}
progress();
window.jarvisPret = () => {
  done = true;
  stageEl.textContent = 'En ligne'; addLine('Tous les systèmes sont en ligne');
};
</script>
</body>
</html>
